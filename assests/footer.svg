<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#006680"/>
      <stop offset="50%"  stop-color="#0a4a6b"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="fwaveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#006680" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="fwaveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0a4a6b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="120" fill="url(#footerBg)"/>

  <!-- Back wave -->
  <path d="M0,30 C200,65 400,10 600,45 C800,80 1000,20 1200,50 L1200,0 L0,0 Z"
        fill="url(#fwaveGrad2)"/>

  <!-- Front wave -->
  <path d="M0,50 C250,85 500,15 750,55 C1000,90 1150,35 1200,55 L1200,0 L0,0 Z"
        fill="url(#fwaveGrad1)"/>

  <!-- Decorative dots -->
  <circle cx="200"  cy="85" r="1.5" fill="#00e5ff" opacity="0.4"/>
  <circle cx="600"  cy="90" r="1"   fill="#80ffff" opacity="0.35"/>
  <circle cx="1000" cy="80" r="1.5" fill="#00e5ff" opacity="0.4"/>
  <circle cx="400"  cy="95" r="1"   fill="#00ccee" opacity="0.3"/>
  <circle cx="800"  cy="100" r="1"  fill="#00e5ff" opacity="0.35"/>
</svg>
